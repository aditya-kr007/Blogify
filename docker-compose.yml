
services:
  backend-1:
    container_name: backend-1
    build:
      context: ./backend
      dockerfile: Dockerfile
    networks:
      - eye-network
    ports:
      - "5001:5000"
    env_file:
      - ./backend/.env
    depends_on:
      - mongo

  backend-2:
    container_name: backend-2
    build:
      context: ./backend
      dockerfile: Dockerfile
    networks:
      - eye-network
    ports:
      - "5002:5000"
    env_file:
      - ./backend/.env
    depends_on:
      - mongo

  backend-3:
    container_name: backend-3
    build:
      context: ./backend
      dockerfile: Dockerfile
    networks:
      - eye-network
    ports:
      - "5003:5000"
    env_file:
      - ./backend/.env
    depends_on:
      - mongo

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    networks:
      - eye-network
    ports:
      - "8000:8000"
    depends_on:
      - backend-1
      - backend-2
      - backend-3
    env_file:
      - ./frontend/.env
    
  mongo:
    image: mongo
    restart: always
    volumes:
      - mongo-data:/data/blog-db
    networks:
      - eye-network
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example

  nginx:
    image: nginx:latest
    networks:
      - eye-network
    depends_on:
      - backend-1
      - backend-2
      - backend-3
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "80:80"
    restart: always

volumes:
  mongo-data:

networks:
  eye-network:
    driver: bridge